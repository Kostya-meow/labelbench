[project]
name = "labelbench"
version = "0.1.0"
description = "Extensible local workbench for image auto-annotation and model comparison"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
    "pillow>=10.4",
    "numpy>=1.26",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3.4", "paddlepaddle>=3.0"]
vision = ["torch>=2.5.1", "torchvision>=0.20.1", "transformers>=5.8.0", "accelerate>=1.2", "scipy>=1.13", "safetensors>=0.8", "ultralytics>=8.4"]
yolo26 = ["ultralytics>=8.4"]
ppocr6 = ["transformers==5.17.0", "torch>=2.5.1", "torchvision>=0.20.1", "safetensors>=0.8", "opencv-python>=4.10"]
rfdetr = ["rfdetr>=1.10,<1.11", "supervision>=0.29", "pyDeprecate>=0.9,<0.10"]
sam2 = ["SAM-2 @ git+https://github.com/facebookresearch/sam2.git"]
all-models = [
    "paddleocr>=3.4",
    "paddlepaddle>=3.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=5.8.0",
    "accelerate>=1.2",
    "scipy>=1.13",
    "safetensors>=0.8",
    "ultralytics>=8.4",
    "rfdetr>=1.10,<1.11",
    "supervision>=0.29",
    "pyDeprecate>=0.9,<0.10",
    "SAM-2 @ git+https://github.com/facebookresearch/sam2.git",
]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]
ui-test = ["playwright>=1.50"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
